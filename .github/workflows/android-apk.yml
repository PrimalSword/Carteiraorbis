name: Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Compilar Carteira Orbis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Verificar TypeScript
        run: npm run typecheck

      - name: Gerar interface móvel
        run: npm run mobile:build

      - name: Criar projeto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Gerar ícone e tela de abertura
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/generate_android_assets.py

      - name: Compilar APK instalável
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Preparar artefato
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/Carteira-Orbis.apk
          sha256sum release/Carteira-Orbis.apk > release/Carteira-Orbis.apk.sha256

      - name: Publicar APK na aba Actions
        uses: actions/upload-artifact@v4
        with:
          name: Carteira-Orbis-Android
          path: release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Resumo do build
        run: |
          {
            echo "## Carteira Orbis Android"
            echo ""
            echo "O APK foi gerado com sucesso. Baixe o artefato **Carteira-Orbis-Android** nesta execução."
            echo ""
            echo "Arquivo instalável: \`Carteira-Orbis.apk\`"
          } >> "$GITHUB_STEP_SUMMARY"
